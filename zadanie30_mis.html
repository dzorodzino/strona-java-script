<body bgcolor="yellow">

    <div style="color:green;font-size:37px;">
        <script type="text/javascript">
            var router = {
                rodzaj: 'bezprzewodowy',
                marka: 'TP-Link',
                predkosc: '1200 Mb/s',

                router_wyswietl_Miszkiel: function()
                {
                    document.write("Dane obiektu Router<br>");
                    document.write("Rodzaj: " + this.rodzaj + "<br>");
                    document.write("Marka: " + this.marka + "<br>");
                    document.write("Prędkość: " + this.predkosc);
                }
            };

            router.router_wyswietl_Miszkiel();
        </script>
    </div>

    <br>

    <div style="color:blue;font-size:34px;">
        <br>
        Mój numer w dzienniku to 11 i moje dane to:<br>

        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;predkosc<br>
        metoda:<br>
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;router_wyswietl_Miszkiel
    </div>
