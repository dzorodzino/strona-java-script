<!DOCTYPE HTML>
<head>

<title>Zadanie 14 - Ułamek egipski</title>
<meta charset="utf-8">

</head>

<body>

<div style="color:green;font-size:30px;">

<script language="JavaScript">

var liczba1 = prompt("Podaj m =", "");
var m_mis = parseFloat(liczba1);

var d1_mis = m_mis + 2;

var mianownik_mis = m_mis * d1_mis;

var d2_mis = mianownik_mis + m_mis + 2;
var d3_mis = mianownik_mis - m_mis;

document.write("m = " + m_mis + "<br><br>");

document.write(
    "1/" + m_mis +
    " = 1/" + d1_mis +
    " + 1/" + d2_mis +
    " + 1/" + d3_mis
);

</script>

</div>

</body>
</html>
