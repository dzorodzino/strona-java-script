<!DOCTYPE HTML>
<head>

<title>proste obliczenia</title>
<meta charset="utf-8">
</head>
<body>
    
    <div style="color:red;font-size:50px;">
        <script language="JavaScript">
            var liczba1=prompt("daj mianownik m=","");
            var m_mis=parseFloat(liczba1);


            document.write("m=" +m_mis+ "<br>");
            m1=m_mis+1;
            m2=(m_mis+1) *m_mis;

            document.write("1/"+m_mis+"=1/"+m1+"+1/"+m2+"<br>");
            </script>
            </div>
