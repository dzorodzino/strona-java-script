       <html> 
         <body> 
          <div style="color:green;font-size:44px;"> 
            <script language="JavaScript"> 

              var D1_mis=prompt("Data1=",""); 
              var D2_mis=prompt("Data2=",""); 
              var sekund; 
              var a=parseFloat(D1_mis); 
              var b=parseFloat(D2_mis); 
                sekund=(a-b)*24*60*60; 
              document.write("Ilość sekund między dniami "+a+" i "+b+" = "+sekund+"<br>"); 
                function okno_zamknij_miszkiel() 
                 { 
                   window.close() 
                 } 
              </script> 
            </div> 
          <input type="button" value="zamknij okno" onclick="okno_zamknij_miszkiel()"/>
