<html> 
 <head>
  <title>zadanie19_Miszkiel</title> 
  <meta charset="UTF-8"> 
  <link rel="stylesheet" href="styl.css"> 
 </head> 
<body> 
 <script type="text/javascript"> 
  function pole_miszkiel() 
   { 
 var a_mis= parseFloat(document.getElementById('dlugosc').value); 
 var b_mis= a_mis*a_mis; 
        document.getElementById("nazwa").innerHTML ="Pole kwadratu= "+b_mis.toFixed(2)+" cm^2";  
   } 
  function obwod_miskziel() 
   { 
 var a_mis= parseFloat(document.getElementById('dlugosc').value); 
 var b_mis= 4*a_mis; 
        document.getElementById("nazwa").innerHTML ="Obwód kwadratu= "+b_mis.toFixed(2)+" cm";  
   } 
 </script> 
  <h1>Wszystko o KWADRACIE</h1><br><br> 
  Podaj długość boku: <input type="text" id="dlugosc" value="podaj długość"> cm<br><br><br> 
  <input type="button" name="pole" value="Oblicz pole" Onclick="pole_miszkiel()"><br><br> 
  <input type="button" name="obwod" value="Oblicz obwod" Onclick="obwod_miskziel()"><br><br> 
  <div  style="color:red;font-size:50px;"id="nazwa"></div> 
</body>
